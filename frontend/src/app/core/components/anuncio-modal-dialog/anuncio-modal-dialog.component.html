<div *ngIf="isVisible && anuncio" 
  class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 overflow-y-auto bg-slate-900/70 backdrop-blur-sm animate-in fade-in duration-300">
  
  <!-- Contenedor del Modal -->
  <div 
    class="relative w-full max-w-lg overflow-hidden rounded-3xl bg-white dark:bg-slate-900 shadow-2xl border border-slate-200/80 dark:border-slate-800 animate-in zoom-in-95 duration-200"
    (click)="$event.stopPropagation()">

    <!-- Botón Cerrar (X) -->
    <button 
      (click)="cerrar()" 
      class="absolute top-4 right-4 z-20 flex h-9 w-9 items-center justify-center rounded-full bg-black/40 hover:bg-black/60 text-white backdrop-blur-md transition-all duration-150 focus:outline-none"
      title="Cerrar aviso">
      <span class="material-symbols-outlined text-lg">close</span>
    </button>

    <!-- Imagen Flyer / Banner (si existe) -->
    <div *ngIf="anuncio.imagenUrl" class="relative w-full h-52 sm:h-64 bg-slate-100 dark:bg-slate-800 overflow-hidden">
      <img 
        [src]="anuncio.imagenUrl" 
        [alt]="anuncio.titulo" 
        class="w-full h-full object-cover object-center transition-transform duration-500 hover:scale-105"
        (error)="anuncio.imagenUrl = ''" />
      <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
      
      <span class="absolute bottom-3 left-4 inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-primary text-white shadow-md">
        <span class="material-symbols-outlined text-sm">campaign</span>
        Novedad Especial
      </span>
    </div>

    <!-- Contenido del Mensaje -->
    <div class="p-6 sm:p-7">
      <div *ngIf="!anuncio.imagenUrl" class="flex items-center gap-2 mb-3">
        <span class="p-2 rounded-xl bg-primary/10 text-primary flex items-center justify-center">
          <span class="material-symbols-outlined text-xl">campaign</span>
        </span>
        <span class="text-xs font-bold uppercase tracking-wider text-primary">Comunicado Oficial</span>
      </div>

      <h2 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white leading-tight">
        {{ anuncio.titulo }}
      </h2>

      <p *ngIf="anuncio.mensaje" class="mt-3 text-sm text-slate-600 dark:text-slate-300 leading-relaxed whitespace-pre-line">
        {{ anuncio.mensaje }}
      </p>

      <!-- Botones de Acción -->
      <div class="mt-6 flex flex-col-reverse sm:flex-row items-center gap-3">
        <button 
          (click)="cerrar()"
          class="w-full sm:w-auto px-5 py-3 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 text-sm font-semibold transition-colors">
          Cerrar
        </button>

        <button 
          *ngIf="anuncio.botonUrl"
          (click)="ejecutarAccion()"
          class="w-full sm:flex-1 px-6 py-3 rounded-xl bg-primary hover:bg-primary-dark text-white font-bold text-sm shadow-lg shadow-primary/25 hover:shadow-primary/40 flex items-center justify-center gap-2 transition-all transform hover:-translate-y-0.5">
          <span>{{ anuncio.botonTexto || 'Ver Más' }}</span>
          <span class="material-symbols-outlined text-lg">arrow_forward</span>
        </button>
      </div>
    </div>

  </div>
</div>
