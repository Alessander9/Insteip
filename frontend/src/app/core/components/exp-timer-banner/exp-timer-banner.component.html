<div 
  class="w-full z-40 transition-all duration-300 shadow-md py-2.5 px-4 flex flex-wrap items-center justify-between gap-3 text-white border-b select-none"
  [ngClass]="{
    'bg-gradient-to-r from-emerald-900 via-teal-800 to-navy-900 border-emerald-600': !isUrgent && !isCritical,
    'bg-gradient-to-r from-amber-900 via-orange-800 to-amber-950 border-amber-500 animate-pulse': isUrgent,
    'bg-gradient-to-r from-rose-950 via-red-900 to-rose-950 border-rose-500 animate-bounce': isCritical
  }"
>
  <!-- Left Side: Badge + Time Text -->
  <div class="flex items-center gap-2.5 sm:gap-3.5">
    <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-extrabold uppercase tracking-wider bg-white/20 backdrop-blur-md border border-white/30 text-emerald-200">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      EXP INSTEIP
    </span>

    <div class="flex items-center gap-2 text-xs sm:text-sm font-semibold tracking-wide">
      <span class="text-base sm:text-lg">⏳</span>
      <span>Tu experiencia INSTEIP finaliza en:</span>
      <span 
        class="font-mono text-sm sm:text-base font-black px-2 py-0.5 rounded bg-black/40 border border-white/20 tracking-widest text-emerald-300"
        [ngClass]="{
          'text-amber-300 border-amber-400/50': isUrgent,
          'text-rose-300 border-rose-400/50': isCritical
        }"
      >
        {{ formattedTime }}
      </span>
      <span class="hidden md:inline text-xs text-white/70">minutos</span>
    </div>
  </div>

  <!-- Right Side: Action Button -->
  <div class="flex items-center gap-2.5 ml-auto">
    <a 
      [href]="whatsappUrl" 
      target="_blank" 
      rel="noopener noreferrer"
      class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition-all shadow-sm shadow-black/20"
    >
      <span>💬</span>
      <span class="hidden sm:inline">Matricularme ahora</span>
      <span class="sm:hidden">Matricularme</span>
    </a>
  </div>
</div>
