upstream insteip_backend {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    server_name insteip.com www.insteip.com;

    listen 443 ssl http2; # managed by Certbot

    ssl_certificate /etc/letsencrypt/live/insteip.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/insteip.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Ocultar version de Nginx
    server_tokens off;

    # Cabeceras de Seguridad Globales
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 110M;

    root /var/www/insteip;
    index index.html;

    # Bloquear acceso a archivos y carpetas ocultas (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # GZIP Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/rss+xml
        image/svg+xml;

    # Exclude index.html (and any other SPA route falling back to it) from caching
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Cache static hashed JS and CSS files for 1 year
    location ~* \.(?:css|js)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Cache static images, icons, and fonts for 1 year
    location ~* \.(?:jpg|jpeg|gif|png|ico|svg|webp|avif|woff|woff2|ttf|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://insteip_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # Proteccion contra conexiones lentas (Slowloris)
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    if ($host = www.insteip.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = insteip.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name insteip.com www.insteip.com;
    return 404; # managed by Certbot
}
